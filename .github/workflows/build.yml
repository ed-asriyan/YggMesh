name: Build Firmware

on:
  workflow_call:
    inputs:
      device:
        description: Device keyname to build
        required: true
        type: string
      yggdrasil_dns:
        description: Space-separated DNS resolver addresses reachable over Yggdrasil
        required: false
        default: "308:c8:48:45:: 300:7c75:d590:c5d8::100"
        type: string
      default_root_password:
        description: Initial root password
        required: true
        default: yggmesh
        type: string
      yggpeers_instances:
        description: Space-separated base URLs of yggpeers instances (https://gitfield.org/fsky/yggpeers) used to auto-discover public Yggdrasil peers. A peer is used only if a majority of the reachable instances report it as up. Leave empty to disable public peers discovery and rely only on multicast discovery.
        required: false
        default: "https://yggpeers.fsky.io"
        type: string
      yggpeers_count:
        description: Target number of global Yggdrasil peers per node with internet on WAN. Peers configured manually count towards this number.
        required: false
        default: "3"
        type: string
      yggpeers_check_interval:
        description: Minutes between checks of the global peers on a node (1-59, or a multiple of 60 up to 1380). Peers that are down are replaced at the next check.
        required: false
        default: "30"
        type: string
      yggpeers_rerank_interval:
        description: Days between forced refreshes of the global peers list on a node (1-90), even if all current peers are alive.
        required: false
        default: "7"
        type: string
      private_ssid:
        description: Client AP SSID for end-user devices
        required: false
        default: YggMesh
        type: string
      clearnet_exits:
        description: Space-separated Yggdrasil addresses (200::/8) or domain names (e.g. .ygg) of clearnet exits (https://github.com/ed-asriyan/YggMesh-exit-node). The fastest working one is used.
        required: false
        default: ""
        type: string
      clearnet_mode:
        description: "What clients' IPv4 uses: wan (directly), exit (only the exits, never WAN), wan_exit (WAN while it works, the exits otherwise) or off. Needs clearnet_exits for exit and wan_exit."
        required: false
        default: wan_exit
        type: string
  workflow_dispatch:
    inputs:
      device:
        description: Device keyname to build
        required: true
        type: choice
        options:
          - axt1800
          - mt3000
          - mt6000
          - ax53u
          - ar300m16
          - cpe710
          - ap3000outdoor
          - wr3000
      yggdrasil_dns:
        description: Space-separated DNS resolver addresses reachable over Yggdrasil
        required: false
        default: "308:c8:48:45:: 300:7c75:d590:c5d8::100"
        type: string
      default_root_password:
        description: Initial root password
        required: true
        default: yggmesh
        type: string
      yggpeers_instances:
        description: Space-separated base URLs of yggpeers instances (https://gitfield.org/fsky/yggpeers) used to auto-discover public Yggdrasil peers. A peer is used only if a majority of the reachable instances report it as up. Leave empty to disable public peers discovery and rely only on multicast discovery.
        required: false
        default: "https://yggpeers.fsky.io"
        type: string
      yggpeers_count:
        description: Target number of global Yggdrasil peers per node with internet on WAN. Peers configured manually count towards this number.
        required: false
        default: "3"
        type: string
      yggpeers_check_interval:
        description: Minutes between checks of the global peers on a node (1-59, or a multiple of 60 up to 1380). Peers that are down are replaced at the next check.
        required: false
        default: "30"
        type: string
      yggpeers_rerank_interval:
        description: Days between forced refreshes of the global peers list on a node (1-90), even if all current peers are alive.
        required: false
        default: "7"
        type: string
      private_ssid:
        description: Client AP SSID for end-user devices
        required: false
        default: YggMesh
        type: string
      clearnet_exits:
        description: Space-separated Yggdrasil addresses (200::/8) or domain names (e.g. .ygg) of clearnet exits (https://github.com/ed-asriyan/YggMesh-exit-node). The fastest working one is used.
        required: false
        default: ""
        type: string
      clearnet_mode:
        description: "What clients' IPv4 uses: wan (directly), exit (only the exits, never WAN), wan_exit (WAN while it works, the exits otherwise) or off. Needs clearnet_exits for exit and wan_exit."
        required: false
        default: wan_exit
        type: choice
        options:
          - wan
          - exit
          - wan_exit
          - "off"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.device }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd wget python3

      - name: Build firmware
        env:
          YGGDRASIL_DNS: ${{ inputs.yggdrasil_dns }}
          DEFAULT_ROOT_PASSWORD: ${{ inputs.default_root_password }}
          YGGPEERS_INSTANCES: ${{ inputs.yggpeers_instances }}
          YGGPEERS_COUNT: ${{ inputs.yggpeers_count || '3' }}
          YGGPEERS_CHECK_INTERVAL: ${{ inputs.yggpeers_check_interval || '30' }}
          YGGPEERS_RERANK_INTERVAL: ${{ inputs.yggpeers_rerank_interval || '7' }}
          PRIVATE_SSID: ${{ inputs.private_ssid || 'YggMesh' }}
          CLEARNET_EXITS: ${{ inputs.clearnet_exits }}
          CLEARNET_MODE: ${{ inputs.clearnet_mode || 'wan_exit' }}
        run: |
          chmod +x scripts/build_router.sh
          ./scripts/build_router.sh "${{ inputs.device }}"

      - name: Resolve artifact name from output filename
        id: artifact-name
        run: |
          bin=$(ls output/*sysupgrade*.bin 2>/dev/null | head -1 || ls output/*.bin | head -1)
          echo "name=$(basename "$bin" .bin)" >> "$GITHUB_OUTPUT"

      - name: Upload device binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: output/*.bin
          if-no-files-found: error
