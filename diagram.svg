<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <pattern id="hatch-red" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#f3a5a5" stroke-width="2"/>
    </pattern>
    <pattern id="hatch-green" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#a8dcae" stroke-width="2"/>
    </pattern>
    <symbol id="phone" viewBox="0 0 28 48" width="22" height="38">
      <rect x="1.5" y="1.5" width="25" height="45" rx="5" fill="#ffffff" stroke="#1e1e1e" stroke-width="2.5"/>
      <rect x="5" y="7" width="18" height="31" rx="1.5" fill="#a5ecf5" stroke="#1971c2" stroke-width="1.5"/>
      <circle cx="14" cy="42" r="1.8" fill="#1e1e1e"/>
    </symbol>
    <symbol id="router" viewBox="0 0 64 40" width="64" height="40">
      <g stroke="#1e1e1e" stroke-width="3" stroke-linecap="round">
        <line x1="17" y1="22" x2="12" y2="3"/>
        <line x1="32" y1="22" x2="32" y2="1"/>
        <line x1="47" y1="22" x2="52" y2="3"/>
      </g>
      <rect x="3" y="21" width="58" height="14" rx="4" fill="#495057" stroke="#1e1e1e" stroke-width="2"/>
      <circle cx="13" cy="28" r="2" fill="#69db7c"/>
      <circle cx="21" cy="28" r="2" fill="#69db7c"/>
      <circle cx="29" cy="28" r="2" fill="#69db7c"/>
      <rect x="9" y="35" width="8" height="3" fill="#1e1e1e"/>
      <rect x="47" y="35" width="8" height="3" fill="#1e1e1e"/>
    </symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/>
    </marker>
  </defs>

  <rect width="960" height="590" fill="#ffffff"/>

  <!-- Zones -->
  <rect x="10" y="10" width="610" height="470" fill="url(#hatch-red)" stroke="#e03131" stroke-width="2.5"/>
  <rect x="10" y="10" width="610" height="470" fill="#ffffff" fill-opacity="0.55"/>
  <text x="315" y="40" text-anchor="middle" font-size="20" fill="#e03131">No Internet / Signal-jammed zone</text>

  <rect x="635" y="10" width="315" height="470" fill="url(#hatch-green)" stroke="#2f9e44" stroke-width="2.5"/>
  <rect x="635" y="10" width="315" height="470" fill="#ffffff" fill-opacity="0.55"/>
  <text x="792" y="40" text-anchor="middle" font-size="20" fill="#2f9e44">Free Internet zone</text>

  <!-- Wi-Fi clients: phones and laptops on the hotspot of a node -->
  <g stroke="#868e96" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" fill="none">
    <line x1="140" y1="150" x2="92"  y2="105"/>
    <line x1="140" y1="150" x2="190" y2="100"/>
    <line x1="140" y1="150" x2="80"  y2="200"/>
    <line x1="320" y1="290" x2="262" y2="262"/>
    <line x1="135" y1="410" x2="80"  y2="365"/>
    <line x1="505" y1="410" x2="470" y2="352"/>
    <line x1="505" y1="410" x2="565" y2="365"/>
  </g>

  <!-- Mesh links: 802.11s Wi-Fi mesh or Ethernet -->
  <g stroke="#1971c2" stroke-width="4" stroke-linecap="round">
    <line x1="140" y1="150" x2="320" y2="290"/>
    <line x1="135" y1="410" x2="320" y2="290"/>
    <line x1="505" y1="410" x2="320" y2="290"/>
    <line x1="510" y1="140" x2="320" y2="290"/>
    <line x1="510" y1="140" x2="700" y2="140"/>
  </g>

  <!-- Clients -->
  <use href="#phone" x="81"  y="76"/>
  <use href="#phone" x="179" y="72"/>
  <use href="#phone" x="62"  y="190"/>
  <use href="#phone" x="240" y="238"/>
  <use href="#phone" x="62"  y="336"/>
  <use href="#phone" x="455" y="322"/>
  <use href="#phone" x="560" y="338"/>

  <!-- Nodes -->
  <use href="#router" x="108" y="126"/>
  <use href="#router" x="288" y="266"/>
  <use href="#router" x="103" y="386"/>
  <use href="#router" x="473" y="386"/>
  <use href="#router" x="478" y="116"/>
  <use href="#router" x="668" y="116"/>
  <text x="700" y="178" text-anchor="middle" font-size="13" fill="#495057">WAN</text>

  <!-- Internet side -->
  <rect x="770" y="105" width="150" height="56" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="845" y="129" text-anchor="middle" font-size="14" fill="#1e1e1e">Yggdrasil network</text>
  <text x="845" y="147" text-anchor="middle" font-size="12" fill="#495057">public peers</text>

  <rect x="790" y="270" width="110" height="50" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  <line x1="790" y1="287" x2="900" y2="287" stroke="#1e1e1e" stroke-width="1.5"/>
  <line x1="790" y1="304" x2="900" y2="304" stroke="#1e1e1e" stroke-width="1.5"/>
  <circle cx="802" cy="279" r="2.5" fill="#2f9e44"/>
  <circle cx="802" cy="296" r="2.5" fill="#2f9e44"/>
  <circle cx="802" cy="312" r="2.5" fill="#2f9e44"/>
  <text x="845" y="340" text-anchor="middle" font-size="13" fill="#1e1e1e">YggMesh exit node</text>

  <rect x="790" y="390" width="110" height="48" rx="4" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  <line x1="790" y1="402" x2="900" y2="402" stroke="#1e1e1e" stroke-width="1.5"/>
  <circle cx="798" cy="396" r="2" fill="#1e1e1e"/><circle cx="805" cy="396" r="2" fill="#1e1e1e"/>
  <text x="845" y="426" text-anchor="middle" font-size="14" fill="#1e1e1e">Internet</text>

  <g fill="none" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M736,138 L764,135"/>
    <path d="M845,163 L845,266"/>
    <path d="M845,344 L845,386"/>
  </g>

  <!-- Legend -->
  <g font-size="14" fill="#1e1e1e">
    <use href="#router" x="40" y="527"/>
    <text x="114" y="552">YggMesh node</text>

    <line x1="250" y1="547" x2="320" y2="547" stroke="#1971c2" stroke-width="4" stroke-linecap="round"/>
    <text x="332" y="542">Wi-Fi mesh (802.11s)</text>
    <text x="332" y="560">or Ethernet</text>

    <use href="#phone" x="500" y="528"/>
    <line x1="530" y1="547" x2="580" y2="547" stroke="#868e96" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
    <text x="592" y="542">Phone / laptop on</text>
    <text x="592" y="560">the node's Wi-Fi</text>

    <line x1="750" y1="547" x2="800" y2="547" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="812" y="552">Over the Internet</text>
  </g>
</svg>
